<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кнопка с эффектом</title>
    <style>
        .button {
            position: relative;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .button:hover {
            background-color: #45a049;
        }

        .button:hover::after {
            content: '+';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 35px;
            color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <button class="button" onclick="cl_cn()">0</button>

    <script>
        function cl_cn() {
            // Код функции
            alert("Функция сработала!");
        }
    </script>

</body>
</html>
