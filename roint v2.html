<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
        rel="stylesheet">
    <title></title>
    <style>
        html,
        body {
            max-width: 100%;
            overflow-x: hidden;
        }

        .main {
            float: right;
            margin-right: 20px;
        }

        .main div {
            float: left;
            transform: skew(-20deg);
            margin-left: 10px;
            line-height: 70px;
            text-align: center;
            padding-top: 10px;
            padding-left: 30px;
            padding-right: 30px;
            border-radius: 20px;
        }

        .time {
            background: rgb(255 255 0);
        }

        .timeAdd {
            background: rgb(255 255 0);
        }

        span {
            display: inline-block;
            transform: skew(20deg);
            font-family: "Roboto", sans-serif;
            font-weight: 500;
            font-style: normal;
            font-size: 50pt;
        }

        .k1 {
            background: rgb(153 153 255);
        }

        .k2 {
            background: rgb(255 51 102);
        }

        .bottom {
            position: absolute;
            bottom: 0;
            background: rgb(80, 80, 80);
            left: 0;
            width: 100%;
            padding-left: 10px;
        }

        .stoka {
            margin-bottom: 10px;
        }

        .big {
            padding-top: 10px;
            padding-bottom: 10px;
        }
    </style>
    <script>
        let secondMilCount = 993;
        let countMin = 15; // длительность тайма
        let tim = countMin * 60;
        let timeOut;
        let flagPere = true;
        let flag_time = true;
        function timerUbdate() {
            document.getElementById("pause").disabled = false;
            document.getElementById("start").disabled = true;
            tim = tim - 1;
            minutes = Math.floor(tim / 60);
            seco = tim - minutes * 60
            let str_out = minutes.toString().padStart(2, '0') + ":" + seco.toString().padStart(2, '0')
            if (tim > 0) {
                timeOut = setTimeout(timerUbdate, secondMilCount);
            }
            else {
                document.getElementById('divbot').style.background = "white"
            }
            if (tim < 30) {
                if (flag_time) {
                    flag_time = false;
                    document.getElementById('divbot').style.background = "tomato"
                } else {
                    flag_time = true;
                    document.getElementById('divbot').style.background = "white"
                }

            }
            let elem = document.getElementById('time');
            elem.textContent = str_out
        }
        function stop() {
            document.getElementById("pause").disabled = true;
            document.getElementById("start").disabled = false;
            clearTimeout(timeOut);
            timeOut = undefined
        }
        function start() {
            if (tim == 0) {
                return
            }
            if (timeOut == undefined) {
                timerUbdate()
            }
        }
        function timeNew() {
            tim = countMin * 60;
            document.getElementById('time').textContent = countMin.toString() + ":00";
        }

        function btn_click_load(isNulPoint) {
            document.getElementById('divbot').style.background = "white"
            let inp_k1 = document.getElementById('name');
            let inp_k2 = document.getElementById('name2');
            let out_k1 = document.getElementById('k1_name');
            out_k1.textContent = inp_k1.value
            let out_k2 = document.getElementById('k2_name');
            out_k2.textContent = inp_k2.value
            if (isNulPoint) {
                btn_click_nulPoint()
                timeNew()                
                document.getElementById('name').value = ""
                document.getElementById('name2').value = ""
                setNumberTime(1);
            }
            console.log("555")
        }
        function btn_click_revers() {
            let out_k1 = document.getElementById('k1_name');
            let sv1 = out_k1.textContent
            let out_k2 = document.getElementById('k2_name');
            out_k1.textContent = out_k2.textContent
            out_k2.textContent = sv1

            let out_p1 = document.getElementById('k1_point');
            sv1 = out_p1.textContent
            let out_p2 = document.getElementById('k2_point');
            out_p1.textContent = out_p2.textContent
            out_p2.textContent = sv1
            console.log("555")
        }
        function btn_click_add(val, id, butElem) {
            let out_p = document.getElementById(id);
            let newVal = Number(out_p.textContent) + val
            if (newVal >= 0) {
                out_p.textContent = newVal
            }
            butElem.blur()
        }
        function btn_click_nulPoint() {
            document.getElementById('k1_point').textContent = 0;
            document.getElementById('k2_point').textContent = 0;
        }
        function setNumberTime(numb) {
            document.getElementById('timeAdd').textContent = "т" + numb.toString();
        }
        function setPere() {
            if (flagPere) {
                document.getElementById('4').style.visibility = 'hidden';
                document.getElementById('time').textContent = "Перерыв";
                document.getElementById('perer').textContent = "Начать тайм 2";
                flagPere = false;
            } else {
                document.getElementById('4').style.visibility = 'visible';
                document.getElementById('time').textContent = countMin.toString() + ":00";
                document.getElementById('perer').textContent = "Перерыв";
                timeNew();
                setNumberTime(2);
                flagPere = true;
                timerUbdate();
            }
        }
        function retimeMinute(val) {
            secondMilCount += val;
            document.getElementById('seclent').textContent = secondMilCount.toString();
        }
        window.onload = function () {
            document.getElementById('buSetTimeManual').textContent = "Выставить на " + countMin.toString() + ":00";
            document.getElementById('seclent').textContent = secondMilCount.toString();
        }
    </script>
</head>

<body>
    <div class="main">

        <div class="name k1"> <span id="k1_name">Наши</span></div>
        <div class="point k1"> <span id="k1_point">0</span> </div>
        <div class="point k2"> <span id="k2_point">0</span></div>
        <div class="name k2"> <span id="k2_name">Чужие</span></div>

        <div class="time"> <span id="time">00:00<span></div>
        <div class="timeAdd" id="4"> <span id="timeAdd">т1<span></div>
    </div>


    <div class="bottom" id="divbot">
        <div class="stoka">
            <div style="display: inline-block;"><label for="name" style="display: block;">Команда слева:</label>
                <input type="text" id="name" name="name" size="15" style="display: block;" />
                <button type="button" class="big" onclick="btn_click_add(1,'k1_point',this)">Счёт +</button>
                <button type="button" onclick="btn_click_add(-1,'k1_point',this)">Счёт -</button>

            </div>
            <div style="display: inline-block;"><label for="name2" style="display: block;">Команда справа:</label>
                <input type="text" id="name2" name="name2" size="15" style="display: block;" />
                <button type="button" onclick="btn_click_add(-1,'k2_point',this)">Счёт -</button>
                <button type="button" class="big" onclick="btn_click_add(1,'k2_point',this)">Счёт +</button>
            </div>
            <div style="display: inline-block;"><button type="button" class="big" onclick="btn_click_load(true)"
                    style="display: block;">Загрузить названия<br>и новый матч</button>
                <button type="button" onclick="btn_click_revers()">Реверс</button>
            </div>
            <!-- </div>
        <div class="stoka"> -->
            <div style="display: inline-block;">
                <button type="button" onclick="btn_click_nulPoint()" style="display: block;">Обнулить счёт</button>
                <button type="button" onclick="btn_click_load(false)">Загрузить данные</button>
            </div>

            <div style="display: inline-block;"> <button type="button" onclick="timeNew()" style="display: block;"
                    id="buSetTimeManual">выставить на 15:00</button>
                <button type="button" onclick="setNumberTime(1)" style="display: block;">тайм 1</button>
                <button type="button" onclick="setNumberTime(2)" style="display: block;">тайм 2</button>
            </div>
            <button type="button" onclick="stop()" id="pause" disabled>Пауза</button>
            <button type="button" class="big" onclick="start()" id="start">Старт</button>
            <button type="button" class="big" id="perer" onclick="setPere()">Перерыв</button>
            <button type="button" disabled id="seclent"></button>
            <button type="button" onclick="retimeMinute(+1)">Длинее</button>
            <button type="button" onclick="retimeMinute(-1)">Короче</button>
        </div>

    </div>

</body>

</html>
